<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="LAPTECH brand usage">
  <title>LAPTECH Logo Clear Space &amp; Usage</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500&amp;display=swap');
      .d { font-family: Manrope, Arial, sans-serif; }
      .b { font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
    </style>
    <linearGradient id="u-bg" x1="8" y1="4" x2="42" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16365f"/><stop offset="1" stop-color="#0a1528"/>
    </linearGradient>
    <linearGradient id="u-l" x1="14" y1="10" x2="34" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14adc4"/><stop offset="0.55" stop-color="#0090a5"/><stop offset="1" stop-color="#febe3b"/>
    </linearGradient>
    <linearGradient id="u-ring" x1="10" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14adc4" stop-opacity="0.9"/><stop offset="1" stop-color="#febe3b" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="u-tech" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14adc4"/><stop offset="100%" stop-color="#febe3b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="#0a1528"/>
  <text class="d" x="40" y="48" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="0.08em">LOGO USAGE</text>

  <!-- Do -->
  <rect x="40" y="80" width="340" height="280" rx="12" fill="#0f1f3d" stroke="#14adc4" stroke-opacity="0.4"/>
  <text class="d" x="60" y="118" fill="#14adc4" font-size="14" font-weight="700" letter-spacing="0.16em">DO</text>
  <g transform="translate(140,160) scale(2)">
    <path d="M24 3.5 41 11.2v12.4c0 9.2-7.1 17.5-17 20.4C14.1 41.1 7 32.8 7 23.6V11.2L24 3.5Z" fill="url(#u-bg)"/>
    <path d="M24 3.5 41 11.2v12.4c0 9.2-7.1 17.5-17 20.4C14.1 41.1 7 32.8 7 23.6V11.2L24 3.5Z" stroke="url(#u-ring)" stroke-width="1.4"/>
    <path d="M18.5 15.5v14.2h11.2" stroke="url(#u-l)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18.5" cy="15.5" r="2.1" fill="#febe3b"/>
    <circle cx="18.5" cy="29.7" r="2.1" fill="#14adc4"/>
    <circle cx="29.7" cy="29.7" r="2.1" fill="#febe3b"/>
  </g>
  <text class="b" x="210" y="300" text-anchor="middle" fill="#a8b8cc" font-size="13">Use on navy · Keep clear space</text>
  <text class="b" x="210" y="324" text-anchor="middle" fill="#7a8da3" font-size="12">Equal to mark height on all sides</text>

  <!-- Don't -->
  <rect x="420" y="80" width="340" height="280" rx="12" fill="#0f1f3d" stroke="#febe3b" stroke-opacity="0.35"/>
  <text class="d" x="440" y="118" fill="#febe3b" font-size="14" font-weight="700" letter-spacing="0.16em">DON'T</text>
  <text class="d" x="590" y="220" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800" opacity="0.35" letter-spacing="0.2em">LAPTECH</text>
  <text class="b" x="590" y="270" text-anchor="middle" fill="#a8b8cc" font-size="13">Don't stretch, recolor, or drop the mark</text>
  <text class="b" x="590" y="294" text-anchor="middle" fill="#7a8da3" font-size="12">Don't place on busy photos without contrast</text>
</svg>
