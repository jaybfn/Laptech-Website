      .d { font-family: Manrope, Arial, sans-serif; }
      .b { font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
    </style>
    <linearGradient id="ll-bg" x1="8" y1="4" x2="42" y2="46" gradientUnits="userSpaceOnUse">
