  <text class="b" x="520" y="68" fill="#a8b8cc" font-size="11" text-anchor="end">+91 7204906049</text>
  <text class="b" x="520" y="86" fill="#a8b8cc" font-size="11" text-anchor="end">laptech.techinfo@gmail.com</text>
  <text class="b" x="738" y="68" fill="#14adc4" font-size="11" text-anchor="end" font-weight="600">Bengaluru</text>
  <text class="b" x="738" y="86" fill="#7a8da3" font-size="10" text-anchor="end">Karnataka 560004</text>

  <rect x="56" y="120" width="682" height="3" rx="1.5" fill="url(#lh-rule)"/>

  <!-- Content guides (subtle) -->
  <text class="b" x="56" y="190" fill="#7a8da3" font-size="12" opacity="0.45">Date</text>
  <text class="b" x="56" y="240" fill="#7a8da3" font-size="12" opacity="0.45">Recipient</text>
  <rect x="56" y="280" width="682" height="680" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-dasharray="6 6" rx="4"/>
  <text class="b" x="397" y="620" fill="#7a8da3" font-size="13" text-anchor="middle" opacity="0.35">Letter content area</text>

  <!-- Footer -->
  <rect x="56" y="1020" width="682" height="1.5" fill="url(#lh-rule)" opacity="0.7"/>
  <text class="b" x="56" y="1050" fill="#7a8da3" font-size="10">No 35, Suprabha Complex, SRI Vasavi Temple Street,</text>
  <text class="b" x="56" y="1066" fill="#7a8da3" font-size="10">Vishweshwarapura, Basavanagudi, Bengaluru, Karnataka 560004</text>
  <text class="d" x="738" y="1058" fill="#a8b8cc" font-size="10" text-anchor="end" font-weight="600" letter-spacing="0.08em">COMPLETE TECHNOLOGY INFRASTRUCTURE</text>
</svg>
