<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" role="img" aria-label="LAPTECH visiting card front">
  <title>LAPTECH Visiting Card  Front</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap');
      .d { font-family: Manrope, Arial, sans-serif; }
      .b { font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
    </style>
    <linearGradient id="vc-page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1528"/>
      <stop offset="100%" stop-color="#0f1f3d"/>
    </linearGradient>
    <linearGradient id="vc-bg" x1="8" y1="4" x2="42" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16365f"/><stop offset="1" stop-color="#0a1528"/>
    </linearGradient>
    <linearGradient id="vc-l" x1="14" y1="10" x2="34" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14adc4"/><stop offset="0.55" stop-color="#0090a5"/><stop offset="1" stop-color="#febe3b"/>
    </linearGradient>
    <linearGradient id="vc-ring" x1="10" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14adc4" stop-opacity="0.9"/><stop offset="1" stop-color="#febe3b" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="vc-tech" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14adc4"/><stop offset="100%" stop-color="#febe3b"/>
    </linearGradient>
    <linearGradient id="vc-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14adc4"/><stop offset="100%" stop-color="#febe3b"/>
    </linearGradient>
  </defs>

  <!-- 90×50mm @ ~11.67px/mm -->
  <rect width="1050" height="600" rx="18" fill="url(#vc-page)"/>
  <circle cx="920" cy="80" r="200" fill="#0090a5" fill-opacity="0.1"/>
  <circle cx="100" cy="520" r="160" fill="#febe3b" fill-opacity="0.06"/>
  <rect x="0" y="0" width="12" height="600" fill="url(#vc-bar)"/>

  <g transform="translate(72,150) scale(2.4)">
    <path d="M24 3.5 41 11.2v12.4c0 9.2-7.1 17.5-17 20.4C14.1 41.1 7 32.8 7 23.6V11.2L24 3.5Z" fill="url(#vc-bg)"/>
    <path d="M24 3.5 41 11.2v12.4c0 9.2-7.1 17.5-17 20.4C14.1 41.1 7 32.8 7 23.6V11.2L24 3.5Z" stroke="url(#vc-ring)" stroke-width="1.4"/>
    <path d="M18.5 15.5v14.2h11.2" stroke="url(#vc-l)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18.5" cy="15.5" r="2.1" fill="#febe3b"/>
    <circle cx="18.5" cy="29.7" r="2.1" fill="#14adc4"/>
    <circle cx="29.7" cy="29.7" r="2.1" fill="#febe3b"/>
  </g>

  <text class="d" x="210" y="230" font-size="64" font-weight="800" letter-spacing="0.14em">
    <tspan fill="#ffffff">LAP</tspan><tspan fill="url(#vc-tech)">TECH</tspan>
  </text>
  <text class="d" x="212" y="278" fill="#7a8da3" font-size="16" font-weight="600" letter-spacing="0.22em">INFRASTRUCTURE · SECURITY · POWER</text>
  <text class="b" x="212" y="360" fill="#a8b8cc" font-size="20">Complete Technology Infrastructure.</text>
  <text class="b" x="212" y="392" fill="#a8b8cc" font-size="20">One Trusted Partner.</text>

  <rect x="72" y="500" width="200" height="4" rx="2" fill="url(#vc-bar)"/>
  <text class="b" x="978" y="540" fill="#7a8da3" font-size="16" text-anchor="end">Bengaluru</text>
</svg>
