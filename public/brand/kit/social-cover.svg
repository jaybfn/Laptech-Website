<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" role="img" aria-label="LAPTECH LinkedIn cover">
  <title>LAPTECH Social Cover</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap');
      .d { font-family: Manrope, Arial, sans-serif; }
      .b { font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
    </style>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1528"/>
      <stop offset="55%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#162d53"/>
    </linearGradient>
    <linearGradient id="sc-mark" x1="8" y1="4" x2="42" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16365f"/><stop offset="1" stop-color="#0a1528"/>
    </linearGradient>
    <linearGradient id="sc-l" x1="14" y1="10" x2="34" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14adc4"/><stop offset="0.55" stop-color="#0090a5"/><stop offset="1" stop-color="#febe3b"/>
    </linearGradient>
    <linearGradient id="sc-ring" x1="10" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14adc4" stop-opacity="0.9"/><stop offset="1" stop-color="#febe3b" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="sc-tech" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14adc4"/><stop offset="100%" stop-color="#febe3b"/>
    </linearGradient>
    <linearGradient id="sc-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14adc4"/><stop offset="100%" stop-color="#febe3b"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1584" height="396" fill="url(#sc-bg)"/>
  <rect width="1584" height="396" fill="url(#grid)"/>
  <circle cx="1400" cy="60" r="220" fill="#0090a5" fill-opacity="0.12"/>
  <circle cx="200" cy="360" r="180" fill="#febe3b" fill-opacity="0.07"/>

  <g transform="translate(80,120) scale(2.8)">
    <path d="M24 3.5 41 11.2v12.4c0 9.2-7.1 17.5-17 20.4C14.1 41.1 7 32.8 7 23.6V11.2L24 3.5Z" fill="url(#sc-mark)"/>
    <path d="M24 3.5 41 11.2v12.4c0 9.2-7.1 17.5-17 20.4C14.1 41.1 7 32.8 7 23.6V11.2L24 3.5Z" stroke="url(#sc-ring)" stroke-width="1.4"/>
    <path d="M18.5 15.5v14.2h11.2" stroke="url(#sc-l)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18.5" cy="15.5" r="2.1" fill="#febe3b"/>
    <circle cx="18.5" cy="29.7" r="2.1" fill="#14adc4"/>
    <circle cx="29.7" cy="29.7" r="2.1" fill="#febe3b"/>
  </g>

  <text class="d" x="240" y="190" font-size="72" font-weight="800" letter-spacing="0.14em">
    <tspan fill="#ffffff">LAP</tspan><tspan fill="url(#sc-tech)">TECH</tspan>
  </text>
  <text class="b" x="244" y="240" fill="#a8b8cc" font-size="24">Complete IT Infrastructure, Surveillance &amp; Power Solutions</text>
  <rect x="244" y="270" width="280" height="4" rx="2" fill="url(#sc-rule)"/>
  <text class="d" x="244" y="320" fill="#7a8da3" font-size="16" font-weight="600" letter-spacing="0.18em">BENGALURU · 15+ YEARS</text>
